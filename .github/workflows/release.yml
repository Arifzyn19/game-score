name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Restore release keystore from secrets
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
          echo "keystore restored"

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify android/app/build/outputs/apk/release/app-release.apk
          echo "APK signature verified"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ScoreBoard ${{ github.ref_name }}
          body: |
            **ScoreBoard** — game score tracker, first to 1000 wins.

            📦 Lampiran: `ScoreBoard-release.apk` (signed, siap install)
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true