<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ScoreBoard" />
  <meta name="description" content="Game score tracker — first to 1000 wins" />
  <title>ScoreBoard</title>

  <link rel="icon" type="image/png" href="icons/logo.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Styling (CDN dev build + in-page design tokens) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Runtime (CDN UMD builds) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="root"></div>

  <!-- App core (plain JS, executed in order) -->
  <script src="js/constants.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/effects.js"></script>

  <!-- App UI (JSX, transpiled in-browser; order matters) -->
  <script type="text/babel" src="js/components/Icon.js"></script>
  <script type="text/babel" src="js/components/WinnerBanner.js"></script>
  <script type="text/babel" src="js/components/PlayerManager.js"></script>
  <script type="text/babel" src="js/components/RoundInput.js"></script>
  <script type="text/babel" src="js/components/ScoreTable.js"></script>
  <script type="text/babel" src="js/App.js"></script>
  <script type="text/babel" src="js/main.js"></script>

  <!-- PWA -->
  <script src="js/pwa.js"></script>
</body>
</html>
